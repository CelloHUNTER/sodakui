<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そだクイ あそぶ</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <h1 class="center">そだクイ</h1>

  <div id="bootCard" class="card center">
    <p class="big">よみこみちゅう…</p>
  </div>

  <div id="codeCard" class="card hidden">
    <p class="big center">へやの ばんごうを いれてね</p>
    <input id="roomInput" class="center" style="font-size:32px; letter-spacing:6px; text-transform:uppercase" maxlength="6" placeholder="ABC123">
    <button id="codeBtn" style="width:100%">へやに はいる</button>
    <p id="codeErr" class="err center"></p>
  </div>

  <div id="nickCard" class="card hidden">
    <p class="big center">じぶんの なまえを えらんでね</p>
    <div id="nickGrid" class="nickgrid"></div>
  </div>

  <div id="waitCard" class="card hidden center">
    <p class="big" id="waitText">じゅんびちゅう…</p>
    <p id="waitName"></p>
  </div>

  <div id="quizCard" class="card hidden">
    <p class="note" id="qProgress"></p>
    <p class="qtext" id="qText"></p>
    <div class="choices" id="qChoices"></div>
  </div>

  <div id="revealCard" class="card hidden center">
    <p id="revealMark" style="font-size:64px; margin:8px"></p>
    <p id="revealText" class="big"></p>
    <p id="revealQ" class="qtext" style="font-size:22px"></p>
    <p id="revealAnswer" class="big"></p>
    <p id="revealPoints" class="big"></p>
    <p id="revealCount"></p>
    <p id="revealRank" class="big"></p>
  </div>

  <div id="awardWaitCard" class="card hidden center">
    <p class="big">けっか はっぴょうちゅう</p>
    <p>おおきい がめんを みてね</p>
  </div>

  <div id="reviewQuizCard" class="card hidden">
    <p class="note" id="rvProgress"></p>
    <p class="qtext" id="rvText"></p>
    <div class="choices" id="rvChoices"></div>
    <div id="rvFeedback" class="hidden center">
      <p id="rvMark" style="font-size:56px; margin:6px"></p>
      <p id="rvMsg" class="big"></p>
      <button id="rvNextBtn">つぎへ</button>
    </div>
  </div>

  <div id="reviewDoneCard" class="card hidden center">
    <p class="big">おつかれさま！</p>
    <p id="rvResult" class="big"></p>
    <p id="rvPoints"></p>
    <button id="rvBackBtn">がんばりカードに もどる</button>
  </div>

  <div id="doneCard" class="card hidden center cert">
    <p class="cert-title">★ がんばりカード ★</p>
    <p id="certName" class="big"></p>
    <p id="certRank" class="cert-rank"></p>
    <p id="certCorrect" class="big"></p>
    <p id="certExp" class="big"></p>
    <p id="certPoints" class="big"></p>
    <button id="cardReviewBtn" class="hidden" style="margin-top:12px">まちがえた もんだいを ふくしゅうする</button>
    <p id="cardReviewNote" class="big"></p>
  </div>

  <button id="exitBtn" class="gray hidden" style="margin-top:16px; width:100%">へやを でる（さいしょに もどる）</button>
  <button id="seBtnChild" class="gray" style="margin-top:8px; width:100%">おと：オン</button>
</div>
<div id="confetti"></div>
<script type="module" src="./play.js?v=20261119e"></script>
</body>
</html>
