<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>そだクイ クイズ編集</title>
<link rel="stylesheet" href="./style.css?v=20261119p">
</head>
<body>
<div class="wrap">
  <h1>そだクイ クイズ編集</h1>
  <p id="authMsg">読み込み中…</p>

  <div id="listView" class="hidden">
    <div class="row">
      <button id="newQuizBtn">＋ あたらしいクイズ</button>
      <a href="./teacher.html"><button class="gray" type="button">先生画面にもどる</button></a>
    </div>
    <div id="quizList"></div>
  </div>

  <div id="editView" class="hidden">
    <label>クイズのタイトル</label>
    <input id="quizTitle" placeholder="例：ことばクイズ 11月">
    <p class="note" id="draftMsg"></p>
    <div class="card" id="genCard">
      <p class="big">言葉クイズ自動生成</p>
      <label>単語リスト（1行に1単語）</label>
      <textarea id="genWords" rows="6" placeholder="ぼうし&#10;トランプ&#10;でんしゃ"></textarea>
      <p class="note">「仲間外れ」の型では、空行でグループを分けてください（例：くだものを数行→空行→どうぶつを数行）。1グループ3語以上・2グループ以上で作れます。</p>
      <label>型</label>
      <select id="genType">
        <option value="first">最初の文字を ○ にする</option>
        <option value="last">最後の文字を ○ にする</option>
        <option value="middle">真ん中の文字を ○ にする</option>
        <option value="shuffle">文字を並び替える</option>
        <option value="odd">仲間外れ（グループから1つだけ違う）</option>
      </select>
      <label>タイトル（指示文）</label>
      <input id="genInst" list="instList" value="○に はいるのは どれ？">
      <datalist id="instList">
        <option value="○に はいるのは どれ？"></option>
        <option value="ただしい ことばは どれ？"></option>
        <option value="ちがうことばに かえてみよう"></option>
        <option value="ならびかえた ことばは どれ？"></option>
        <option value="仲間外れは どれ？"></option>
      </datalist>
      <div class="row"><button id="genBtn" class="sub" type="button">問題を生成して追加</button></div>
      <p class="note" id="genMsg"></p>
    </div>
    <div id="questionsBox"></div>
    <div class="row">
      <button id="addQBtn" class="sub">＋ 問題を追加</button>
      <button id="previewBtn" class="gray" type="button">子ども側プレビュー</button>
    </div>
    <div id="previewBox" class="card hidden">
      <p class="note">子ども側の見え方</p>
      <div class="row" id="previewNav"></div>
      <div class="row"><button id="pvHintBtn" class="gray" type="button">ヒント表示：オフ</button></div>
      <p id="pvTitle" class="center big"></p>
      <p id="pvText" class="qtext"></p>
      <div class="imgwrap hidden" id="pvImgWrap"><img id="pvImg" class="qimg2" alt=""><div class="marks" id="pvMarks"></div></div>
      <div id="pvChoices" class="choices"></div>
    </div>
    <p id="saveMsg"></p>
    <div class="row">
      <button id="saveBtn">保存する</button>
      <button id="backBtn" class="gray" type="button">一覧にもどる</button>
      <button id="undoBtn" class="gray" type="button">← もどる</button>
      <button id="redoBtn" class="gray" type="button">すすむ →</button>
    </div>
  </div>
</div>
<div id="markBar" class="markbar hidden"></div>
<script type="module" src="./editor.js?v=20261119p"></script>
</body>
</html>
